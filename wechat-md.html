<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown → 公众号（代码横向滚动）</title>
<!-- 代码高亮主题：用于在预览中算出每个 token 的颜色，再转成行内样式 -->
<link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/styles/atom-one-dark.min.css">
<!-- MathJax：公式渲染成自包含 SVG（fontCache:local），再转 PNG 内嵌 -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
    svg: { fontCache: 'local' },
    startup: { typeset: false },
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.min.js"></script>
<style>
  :root { --gap: 12px; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #222; background: #f5f6f7;
  }
  header {
    padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e6eb;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .hint { color: #86909c; font-size: 12px; }
  .toolbar { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  select, button {
    font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid #d0d3d9;
    background: #fff; cursor: pointer;
  }
  button.primary { background: #07c160; color: #fff; border-color: #07c160; font-weight: 600; }
  button.primary:active { background: #06ad56; }
  #status { font-size: 12px; color: #07c160; min-width: 60px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap); padding: var(--gap); height: calc(100vh - 56px); }
  .pane { background: #fff; border: 1px solid #e5e6eb; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .pane > .label { padding: 6px 12px; font-size: 12px; color: #86909c; border-bottom: 1px solid #f0f1f3; background: #fafbfc; }
  textarea {
    flex: 1; border: 0; outline: 0; resize: none; padding: 16px;
    font: 13px/1.6 "SF Mono", Menlo, Consolas, monospace; color: #333;
  }
  /* 预览区滚动容器，模拟手机宽度（375px）方便检查横向滚动效果 */
  #preview-scroll { flex: 1; overflow: auto; padding: 16px; background: #fff; }
  #preview { max-width: 100%; }
  .phone #preview-scroll { background: #ebedf0; padding: 16px 0; display: flex; justify-content: center; }
  .phone #preview { width: 375px; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } textarea { min-height: 240px; } }
  /* 代码图片导出弹窗 */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; z-index: 50; padding: 24px; overflow: auto; }
  #modal.open { display: block; }
  .modal-box { max-width: 900px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 20px; }
  .modal-box .head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .modal-box .head h2 { font-size: 16px; margin: 0; }
  .modal-box .head .tip { color: #86909c; font-size: 12px; }
  .modal-box .head .x { margin-left: auto; }
  .shot { margin: 16px 0; padding: 12px; border: 1px solid #eee; border-radius: 8px; }
  .shot .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .shot .bar b { font-size: 13px; }
  .shot img { max-width: 100%; display: block; border-radius: 6px; }
</style>
</head>
<body>
<header>
  <h1>Markdown → 公众号</h1>
  <span class="hint">代码转图片内嵌 · 全行内样式 · 复制粘贴即可</span>
  <div class="toolbar">
    <label class="hint"><input type="checkbox" id="phone"> 模拟手机宽度</label>
    <select id="theme" title="代码配色">
      <option value="atom-one-dark">深色 (atom-one-dark)</option>
      <option value="github">浅色 (github)</option>
      <option value="atom-one-light">浅色 (atom-one-light)</option>
      <option value="monokai">深色 (monokai)</option>
    </select>
    <select id="frame" title="代码图片底色">
      <option value="none">代码底：无</option>
      <option value="cream">代码底：米白</option>
      <option value="apricot">代码底：暖杏</option>
      <option value="gray">代码底：浅灰</option>
      <option value="mint">代码底：薄荷</option>
      <option value="sky">代码底：蓝天渐变</option>
      <option value="sunset">代码底：晚霞渐变</option>
      <option value="ocean">代码底：深海渐变</option>
    </select>
    <select id="page" title="整篇文章底色">
      <option value="cream">文章底：米白</option>
      <option value="none">文章底：白</option>
      <option value="apricot">文章底：暖杏</option>
      <option value="gray">文章底：浅灰</option>
      <option value="mint">文章底：薄荷</option>
      <option value="pink">文章底：淡粉</option>
      <option value="blue">文章底：浅蓝</option>
    </select>
    <button id="copy" class="primary">复制全文（含代码图）</button>
    <button id="export">单独导出图片</button>
    <span id="status"></span>
  </div>
</header>
<main>
  <section class="pane">
    <div class="label">Markdown 输入</div>
    <textarea id="src" spellcheck="false"></textarea>
  </section>
  <section class="pane">
    <div class="label">预览（复制的就是这个，已内联所有样式）</div>
    <div id="preview-scroll"><div id="preview"></div></div>
  </section>
</main>

<!-- 离屏「源」：渲染高亮+内联样式，用于算颜色/生成图片/复制正文（不直接展示） -->
<div id="source" style="position:absolute;left:-99999px;top:0;width:760px;"></div>

<div id="modal">
  <div class="modal-box">
    <div class="head">
      <h2>代码图片</h2>
      <span class="tip">右键/长按保存，或点「下载」。再到公众号文章里用「图片」按钮上传到对应占位处。</span>
      <button class="x" onclick="document.getElementById('modal').classList.remove('open')">关闭</button>
    </div>
    <div style="margin-bottom:12px;"><button id="dl-all" class="primary">下载全部</button></div>
    <div id="shots"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11/highlight.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const src = $('#src'), preview = $('#preview'), source = $('#source');

// —— 行内样式表（class 会被微信删掉，只有 inline style 能存活）——
const INLINE = {
  H1: 'font-size:22px;font-weight:bold;margin:28px 0 16px;line-height:1.3;color:#1a1a1a;',
  H2: 'font-size:19px;font-weight:bold;margin:24px 0 14px;line-height:1.3;color:#1a1a1a;border-left:4px solid #07c160;padding-left:10px;',
  H3: 'font-size:17px;font-weight:bold;margin:20px 0 12px;line-height:1.3;color:#1a1a1a;',
  H4: 'font-size:15px;font-weight:bold;margin:18px 0 10px;color:#1a1a1a;',
  P:  'margin:14px 0;font-size:15px;line-height:1.8;color:#3f3f3f;letter-spacing:.3px;',
  A:  'color:#576b95;text-decoration:none;',
  STRONG: 'font-weight:bold;color:#1a1a1a;',
  EM: 'font-style:italic;',
  UL: 'margin:14px 0;padding-left:24px;',
  OL: 'margin:14px 0;padding-left:24px;',
  LI: 'margin:6px 0;font-size:15px;line-height:1.8;color:#3f3f3f;',
  BLOCKQUOTE: 'margin:16px 0;padding:10px 16px;border-left:4px solid #dcdee0;background:#f7f8fa;color:#646566;',
  HR: 'border:0;border-top:1px solid #e5e6eb;margin:24px 0;',
  IMG: 'max-width:100%;border-radius:6px;display:block;margin:14px auto;',
  TABLE: 'border-collapse:collapse;width:100%;margin:14px 0;font-size:14px;',
  TH: 'border:1px solid #e5e6eb;padding:8px 12px;background:#fafbfc;font-weight:bold;',
  TD: 'border:1px solid #e5e6eb;padding:8px 12px;',
};

marked.setOptions({ breaks: true, gfm: true });

async function render() {
  source.innerHTML = marked.parse(src.value || '');
  // 新版 marked 已移除 highlight 选项，这里手动高亮：
  // highlightElement 会给 <code> 加上 .hljs 类（带浅色文字）并生成带色 token
  source.querySelectorAll('pre code').forEach(el => {
    try { hljs.highlightElement(el); } catch {}
  });
  inlineStyles(source);
  typesetMath(source);              // $...$ → SVG
  await mathSvgToImg(source);       // SVG → PNG 内嵌图（微信可收）
  buildPreview();
}

// 把正文里的 $...$ / $$...$$ 替换成 MathJax 渲染的 SVG（跳过代码块）
function typesetMath(root) {
  if (!(window.MathJax && MathJax.tex2svg)) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n) {
      if (n.parentElement.closest('pre,code')) return NodeFilter.FILTER_REJECT;
      return n.nodeValue.includes('$') ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
    }
  });
  const nodes = []; for (let n; (n = walker.nextNode());) nodes.push(n);
  const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
  nodes.forEach(node => {
    const text = node.nodeValue;
    if (!re.test(text)) return; re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(text))) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const display = m[1] != null;
      const tex = display ? m[1] : m[2];
      let svg;
      try { svg = MathJax.tex2svg(tex, { display }).querySelector('svg'); } catch {}
      if (svg) {
        svg.style.color = '#1a1a1a';
        if (display) {
          const box = document.createElement('div');
          box.style.cssText = 'text-align:center;margin:16px 0;';
          box.appendChild(svg); frag.appendChild(box);
        } else frag.appendChild(svg);
      } else frag.appendChild(document.createTextNode(m[0]));
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.replaceWith(frag);
  });
}

// 单个 SVG → PNG dataURL（SVG 无外部资源，可安全画到 canvas）
function svgToPng(svg, w, h, scale) {
  return new Promise((res, rej) => {
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', w); clone.setAttribute('height', h);
    clone.style.color = '#1a1a1a';
    const str = new XMLSerializer().serializeToString(clone);
    const url = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(str)));
    const im = new Image();
    im.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.ceil(w * scale));
      cv.height = Math.max(1, Math.ceil(h * scale));
      const ctx = cv.getContext('2d'); ctx.scale(scale, scale);
      ctx.drawImage(im, 0, 0, w, h);
      res({ url: cv.toDataURL('image/png'), w, h });
    };
    im.onerror = rej; im.src = url;
  });
}

// 把 source 里所有数学 SVG 替换成 PNG 图（保持原始像素尺寸）
async function mathSvgToImg(root) {
  const svgs = [...root.querySelectorAll('svg')];
  for (const svg of svgs) {
    const r = svg.getBoundingClientRect();
    const w = r.width || 20, h = r.height || 20;
    let png;
    try { png = await svgToPng(svg, w, h, 3); } catch { continue; }
    const img = document.createElement('img');
    img.src = png.url;
    img.style.cssText = `width:${png.w}px;height:${png.h}px;vertical-align:middle;`;
    svg.replaceWith(img);
  }
}

// 整篇文章底色（纯色，渐变会被微信过滤）
const PAGES = {
  none: '', cream: '#f7f3ea', apricot: '#faf1de', gray: '#f0f2f5',
  mint: '#eaf4ef', pink: '#fbeef0', blue: '#eef2fb',
};
const PAGE_PAD = '20px 16px';

// 预览区 = 所见即所得：正文文字 + 代码块渲染成最终带底色的图片
function buildPreview() {
  const clone = source.cloneNode(true);
  clone.querySelectorAll('pre').forEach(pre => {
    const cv = renderCodeImage(pre, $('#frame').value);
    const img = document.createElement('img');
    img.src = cv.toDataURL('image/png');
    img.style.cssText = 'max-width:100%;display:block;margin:16px auto;border-radius:8px;';
    pre.replaceWith(img);
  });
  preview.innerHTML = '';
  while (clone.firstChild) preview.appendChild(clone.firstChild);
  // 文章底色应用到预览
  const pg = PAGES[$('#page').value];
  preview.style.background = pg || '';
  preview.style.padding = pg ? PAGE_PAD : '';
}

function inlineStyles(root) {
  // 1) 普通块级/行内元素：套基础行内样式
  root.querySelectorAll('*').forEach(el => {
    const base = INLINE[el.tagName];
    if (base) el.style.cssText = base + el.style.cssText;
  });

  // 2) 行内 code（不在 pre 里的）
  root.querySelectorAll('code').forEach(code => {
    if (code.closest('pre')) return;
    code.style.cssText = 'background:#f3f4f6;color:#c0341d;padding:2px 6px;border-radius:4px;'
      + 'font-size:13px;font-family:Menlo,Consolas,monospace;word-break:break-word;';
  });

  // 3) 代码块：关键——横向滚动，不换行
  root.querySelectorAll('pre').forEach(pre => {
    const themeBg = getComputedStyle(pre.querySelector('code') || pre).backgroundColor;
    pre.style.cssText =
      'overflow-x:auto;-webkit-overflow-scrolling:touch;' +   // 长行横向滚动
      'background:' + (themeBg && themeBg !== 'rgba(0, 0, 0, 0)' ? themeBg : '#282c34') + ';' +
      'border-radius:8px;padding:16px;margin:16px 0;' +
      'font-size:13px;line-height:1.5;';
    const code = pre.querySelector('code');
    if (code) {
      code.style.cssText =
        'white-space:pre;' +                                  // pre 而非 pre-wrap = 不自动换行
        'display:block;font-family:Menlo,Consolas,monospace;' +
        'background:transparent;padding:0;color:' + getComputedStyle(code).color + ';';
    }
  });

  // 4) 高亮 token：把主题算出的颜色固化成行内 color
  root.querySelectorAll('pre code span').forEach(span => {
    const c = getComputedStyle(span).color;
    if (c) span.style.color = c;
    span.removeAttribute('class');
  });
}

function flash(t){ const s=$('#status'); s.textContent=t; setTimeout(()=>s.textContent='',2500); }

// —— 复制全文：代码块直接内嵌成 base64 图片，粘到公众号时微信会自动收图上传 ——
async function copyProse() {
  const clone = source.cloneNode(true);
  clone.querySelectorAll('pre').forEach(pre => {
    const cv = renderCodeImage(pre, $('#frame').value);
    const img = document.createElement('img');
    img.src = cv.toDataURL('image/png');   // base64 内嵌，粘贴时微信自动上传
    img.style.cssText = 'max-width:100%;display:block;margin:16px auto;border-radius:8px;';
    pre.replaceWith(img);
  });
  // 整篇包进带底色的 section（微信保留 section 行内背景）
  const pg = PAGES[$('#page').value];
  const html = pg
    ? `<section style="background:${pg};padding:${PAGE_PAD};">${clone.innerHTML}</section>`
    : clone.innerHTML;
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], { type: 'text/html' }),
      'text/plain': new Blob([clone.innerText], { type: 'text/plain' }),
    })]);
    flash('✓ 正文已复制');
  } catch {
    const tmp = document.createElement('div');
    tmp.style.cssText = 'position:fixed;left:-9999px;'; tmp.innerHTML = html;
    document.body.appendChild(tmp);
    const range = document.createRange(); range.selectNodeContents(tmp);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
    document.execCommand('copy'); sel.removeAllRanges(); tmp.remove();
    flash('✓ 正文已复制');
  }
}

// —— 把一个高亮后的 <code> 拆成「行 → 片段(文本+颜色)」 ——
function tokenize(codeEl, defColor) {
  const lines = [[]];
  (function walk(node, color) {
    node.childNodes.forEach(n => {
      if (n.nodeType === 3) {
        const parts = n.nodeValue.split('\n');
        parts.forEach((p, i) => {
          if (i > 0) lines.push([]);
          if (p) lines[lines.length - 1].push({ text: p, color });
        });
      } else if (n.nodeType === 1) {
        walk(n, n.style.color || color);
      }
    });
  })(codeEl, defColor);
  return lines;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// —— 图片外层底色预设（字符串=纯色；数组=上→下渐变）——
const FRAMES = {
  none:    null,
  cream:   '#f5efe3',
  apricot: '#f8ecd2',
  gray:    '#eaeef3',
  mint:    '#e2f0e9',
  sky:     ['#a1c4fd', '#c2e9fb'],
  sunset:  ['#ffd3a5', '#fd9eb6'],
  ocean:   ['#2b5876', '#4e4376'],
};

// —— 用 canvas 把代码块画成高清 PNG（外层底色 + 浮起的代码卡 + Mac 圆点）——
function renderCodeImage(pre, frameKey) {
  const code = pre.querySelector('code');
  const bg = pre.style.backgroundColor || '#282c34';
  const defColor = code.style.color || '#abb2bf';
  const lines = tokenize(code, defColor);
  const s = 2;                                   // 2x 高清
  const fs = 15 * s, lh = Math.round(fs * 1.6);
  const font = `${fs}px Menlo, Consolas, "SF Mono", monospace`;
  const padX = 20 * s, padTop = 46 * s, padBot = 22 * s;

  const m = document.createElement('canvas').getContext('2d'); m.font = font;
  let maxW = 0;
  for (const line of lines) {
    let w = 0; for (const seg of line) w += m.measureText(seg.text).width;
    maxW = Math.max(maxW, w);
  }
  const cardW = Math.ceil(maxW + padX * 2);
  const cardH = Math.ceil(lines.length * lh + padTop + padBot);

  const frame = FRAMES[frameKey];
  const fp = frame ? 36 * s : 0;                 // 外层留白；无底色则贴边
  const W = cardW + fp * 2, H = cardH + fp * 2;

  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // 外层底色
  if (frame) {
    if (Array.isArray(frame)) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, frame[0]); g.addColorStop(1, frame[1]);
      ctx.fillStyle = g;
    } else ctx.fillStyle = frame;
    ctx.fillRect(0, 0, W, H);
  }

  // 代码卡（带阴影）
  ctx.save();
  if (frame) { ctx.shadowColor = 'rgba(0,0,0,.22)'; ctx.shadowBlur = 24 * s; ctx.shadowOffsetY = 8 * s; }
  ctx.fillStyle = bg; roundRect(ctx, fp, fp, cardW, cardH, 12 * s); ctx.fill();
  ctx.restore();

  // Mac 圆点
  ['#ff5f56', '#ffbd2e', '#27c93f'].forEach((c, i) => {
    ctx.fillStyle = c; ctx.beginPath();
    ctx.arc(fp + padX + 6 * s + i * 22 * s, fp + 22 * s, 6 * s, 0, Math.PI * 2); ctx.fill();
  });

  // 代码文本
  ctx.font = font; ctx.textBaseline = 'top';
  lines.forEach((line, li) => {
    let x = fp + padX; const y = fp + padTop + li * lh;
    for (const seg of line) {
      ctx.fillStyle = seg.color || defColor;
      ctx.fillText(seg.text, x, y);
      x += ctx.measureText(seg.text).width;
    }
  });
  return cv;
}

function exportImages() {
  const pres = source.querySelectorAll('pre');
  const shots = $('#shots'); shots.innerHTML = '';
  if (!pres.length) { flash('没有代码块'); return; }
  const frameKey = $('#frame').value;
  pres.forEach((pre, i) => {
    const cv = renderCodeImage(pre, frameKey);
    const url = cv.toDataURL('image/png');
    const name = `code-${i + 1}.png`;
    const item = document.createElement('div'); item.className = 'shot';
    item.innerHTML = `<div class="bar"><b>代码图片 ${i + 1}</b>`
      + `<a download="${name}" href="${url}"><button>下载 ${name}</button></a></div>`;
    const img = document.createElement('img'); img.src = url; item.appendChild(img);
    item.dataset.name = name; item.dataset.url = url;
    shots.appendChild(item);
  });
  $('#modal').classList.add('open');
}

$('#dl-all').addEventListener('click', () => {
  $('#shots').querySelectorAll('.shot').forEach((it, i) => {
    setTimeout(() => {
      const a = document.createElement('a');
      a.href = it.dataset.url; a.download = it.dataset.name; a.click();
    }, i * 300);
  });
});

src.value = `# PyTorch 一行代码搞定线性代数

平时**买菜**用不上求根公式，但写模型时少不了它。下面演示一个很长的代码行，看它在手机上如何横向滚动而不破坏排版：

## 代码示例

\`\`\`python
import torch
# 这是一行故意写得很长的代码，用来测试公众号手机端代码块是否能横向滚动而不是乱掉乱换行影响阅读体验
x = torch.linspace(-10, 10, 1000).reshape(-1, 1)
y = 3 * x ** 2 + 2 * x + 1 + torch.randn_like(x) * 5   # 加点噪声，模拟真实数据
print(x.shape, y.shape)
\`\`\`

行内代码像这样：\`torch.linspace()\`，会自动适配。

## 数学公式

行内公式 $E = mc^2$ 也会转成图片。下面是块级公式：

$$\\frac{\\partial L}{\\partial w} = \\frac{1}{n}\\sum_{i=1}^{n} 2(wx_i + b - y_i)x_i$$
